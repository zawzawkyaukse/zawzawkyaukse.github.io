<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="addstudent">  
        <h1> Add New Student Next Time</h1>
        Name: <input type="text" id="name" name="name"><br><br>
        Email: <input type="email" id="email" name="email"><br><br>
        Phone: <input type="number" id="phone" name="phone"><br><br>
        Year: <select name="year" id="year">
            <option value="">Select Year</option>
            <option value="First">1st Year</option>
            <option value="Second">2nd Year</option>
            <option value="Third">3rd Year</option>
        </select><br><br>
        <button id="add">Add Student</button>

    </div>

    <h1>Student List</h1>
    <table border="1" cellspacing="0" cellpadding="20">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Year</th>
            </tr>
        </thead>
        <tbody id="stuTbody">

        </tbody>


    
    <script src="jquery.min.js"></script>
    <script>

        $(document).ready(function(){
            getData();

            function getData() {
                let stuString = localStorage.getItem("students");
                

                if (stuString) {
                    let stuArray = JSON.parse(stuString);
                    let data = "";

                    $.each (stuArray, function(i,v){
                        data += `<tr>
                           <td>${v.stu_name}</td>
                           <td>${v.stu_emai}</td>
                           <td>${v.stu_phone}</td>
                           <td>${v.stu_year}</td>
                          </tr>`

                        $('#stuTbody').html(data);    
                    })
                }
            }



            let data = "";
            $('#add').click(function() {

                
                let name = $("#name").val();
                let email = $("#email").val();
                let phone = $("#phone").val();
                let year = $("#year").val();

                //console.log(name);


                let studentObject = {
                stu_name: name,
                stu_emai: email,
                stu_phone: phone,
                stu_year: year
            }

            // console.log(studentObject);

            let stuString = localStorage.getItem("students");
            let stuArray = [];

            if (stuString == null) {
                stuArray = [];
            }
            else{
                stuArray = JSON.parse(stuString);
            }


            stuArray.push(studentObject);
            let stuData = JSON.stringify(stuArray);

            localStorage.setItem("students",stuData);


            
            // data += `<tr>
            //             <td>${name}</td>
            //             <td>${email}</td>
            //             <td>${phone}</td>
            //             <td>${year}</td>
            //         </tr>`

            // $('#stuTbody').html(data);       
            getData();

            })

            
           

           

        });
    </script>



</body>
</html>
