<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div id="addStudent">  
        <h1> Add New Student</h1>
        Name: <input type="text" id="name" name="name"><br><br>
        Email: <input type="email" id="email" name="email"><br><br>
        Phone: <input type="number" id="phone" name="phone"><br><br>
        Year: <select name="year" id="year">
            <option value="">Select Year</option>
            <option value="First">1st Year</option>
            <option value="Second">2nd Year</option>
            <option value="Third">3rd Year</option>
        </select><br><br>
        <button id="add">Add Student</button>

    </div>
    <div id="updStudent">  
        <h1> Update Student</h1>
        Name: <input type="text" id="edit_name" name="name"><br><br>
        Email: <input type="email" id="edit_email" name="email"><br><br>
        Phone: <input type="number" id="edit_phone" name="phone"><br><br>
        Year: <select name="year" id="edit_year">
            <option value="">Select Year</option>
            <option value="First">1st Year</option>
            <option value="Second">2nd Year</option>
            <option value="Third">3rd Year</option>
        </select><br><br>
        <button id="upd">Update Student</button>

    </div>

    <h1>Student List</h1>
    <table border="1" cellspacing="0" cellpadding="20">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Year</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="stuTbody">

        </tbody>


    
    <script src="jquery.min.js"></script>
    <script>
        $(document).ready(function() {
            getData();

            $('#addStudent').show();
            $('#updStudent').hide();
            function getData() {
                let stuString = localStorage.getItem ('students');

                if (stuString){
                    let stuArray = JSON.parse(stuString);
                    let data = '';

                    $.each (stuArray, function (i,v) {
                        data +=`<tr>
                            <td>${v.stu_name}</td>
                            <td>${v.stu_email}</td>
                            <td>${v.stu_phone}</td>
                            <td>${v.stu_year}</td>
                            <td>
                                <button class="edit" data-key="${i}" data-name="${v.stu_name}"  data-email="${v.stu_email}"  data-phone="${v.stu_phone}"  data-year="${v.stu_year}" >Edit</button>
                                <button class="delete" data-key="${i}">Delete</button>
                            </td>
                            </tr>`
                    })
                    $('#stuTbody').html(data);
                }
            }

            //let data = '';
            $("#add").click(function() {
                let name = $("#name").val();
                let email = $("#email").val();
                let phone = $("#phone").val();
                let year = $("#year").val();

              //  console.log(name, email, phone, year);


                let studentObject = {
                    stu_name: name,
                    stu_email: email,
                    stu_phone: phone,
                    stu_year: year
                }
                console.log(studentObject);

                let stuString = localStorage.getItem('students');
                let stuArray = [];

                if (stuString == null) {
                    stuArray = [];
                } else {
                    stuArray = JSON.parse(stuString);
                }

                stuArray.push(studentObject);

                let stuData = JSON.stringify(stuArray);
                localStorage.setItem('students', stuData);

                 getData();

                
               /* data +=`<tr>
                    <td>${name}</td>
                    <td>${email}</td>
                    <td>${phone}</td>
                    <td>${year}</td>`

                $('#stuTbody').html(data); */
            })

            
            $('#stuTbody').on('click','.delete',function(){
                //alert('hello');

                let key = $(this).data('key');
                console.log(key);

                let ans = confirm ("Are you sure Delete");
                console.log(ans);

                if (ans) {
                    let stuString = localStorage.getItem('students');
                    if(stuString){
                        let stuArray = JSON.parse(stuString);

                        stuArray.splice(key,1);

                        let stuData = JSON.stringify(stuArray);
                        localStorage.setItem("students",stuData);

                        getData();
                    }
                }



            })


            $('#stuTbody').on('click','.edit',function(){
                $('#addStudent').hide();
                $('#updStudent').show();



                let key = $(this).data('key');
                let name = $(this).data('name');
                let email = $(this).data('email');
                let phone = $(this).data('phone');
                let year = $(this).data('year');

            })
        });

    </script>


</body>
</html>
