<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="addemployee">  
        <h1> Add New Employee</h1>
        Name: <input type="text" id="name" name="name"><br><br>
        Email: <input type="email" id="email" name="email"><br><br>
        Phone: <input type="number" id="phone" name="phone"><br><br>
        Year: <select name="year" id="year">
            <option value="">Select Year</option>
            <option value="First">1st Year</option>
            <option value="Second">2nd Year</option>
            <option value="Third">3rd Year</option>
        </select><br><br>
        <button id="add">Add Employee</button>

    </div>

    <h1>Employee List</h1>
    <table border="1" cellspacing="0" cellpadding="20">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Year</th>
            </tr>
        </thead>
        <tbody id="empTbody">

        </tbody>
    </table>

        <script src="./jquery.min.js"></script>
        <script>
            $(document).ready(function(){
                getData();
                function getData() {
                    let empString = localStorage.getItem("employees");
                    
                    if (empString) {
                        let empArray = JSON.parse(empString);
                        let data = '';


                        $.each (empArray, function(i,v){
                            data +=`<tr>
                                        <td>${v.emp_name}</td>
                                        <td>${v.emp_email}</td>
                                        <td>${v.emp_phone}</td>
                                        <td>${v.emp_year}</td>
                                    </tr>`;
                                    
                            
                        })
                        $("#empTbody").html(data);
                    }
                }




                let data = '';
                $('#add').click(function(){
                    let name = $('#name').val();
                    let email = $('#email').val();
                    let phone = $('#phone').val();
                    let year = $('#year').val();


                    //console.log(name,email,phone,year);

                    let empObject = {
                         emp_name: name,
                         emp_email: email,
                         emp_phone: phone,
                         emp_year: year
                    }




                    let empString = localStorage.getItem("employees");
                    let empArray = [];

                    if (empString == null ){
                        empArray = [];
                    }else{
                        empArray = JSON.parse(empString);
                    }

                    empArray.push(empObject);
                    let empData = JSON.stringify(empArray);
                    localStorage.setItem('employees', empData);
                    getData();

                    
                    // data += `<tr>
                    //             <td>${name}</td>
                    //             <td>${email}</td>
                    //             <td>${phone}</td>
                    //             <td>${year}</td>
                    //         </tr>`

                    //         $("#empTbody").html(data);
                })

                

            });
        </script>

</body>
</html>
